<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <title>Explorateur de modele</title>
  <style>
    body{margin:0;background:#101418;color:#ddd;font-family:monospace;font-size:12px;}
    #log{padding:10px;white-space:pre;}
  </style>
</head>
<body>
<div id="log">Chargement...</div>
<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script>
var L=[]; function log(s){L.push(s);document.getElementById('log').textContent=L.join('\n');}
if(location.protocol==='file:'){log('Ouvre via test-sur-pc.bat, pas en double-clic.');throw 0;}

var fichier = new URLSearchParams(location.search).get('m') || 'cric.glb';

new THREE.GLTFLoader().load(fichier, function(gltf){
  var racine=gltf.scene;
  racine.updateMatrixWorld(true);

  var box=new THREE.Box3().setFromObject(racine), t=new THREE.Vector3(); box.getSize(t);
  log('=== '+fichier+' ===');
  log('encombrement : '+t.x.toFixed(3)+' x '+t.y.toFixed(3)+' x '+t.z.toFixed(3)+' m');
  log('');
  log('--- positions MONDE des noeuds nommes (hors "Forme") ---');
  log('nom'.padEnd(46)+'  x       y       z');

  var pts=[];
  racine.traverse(function(n){
    if(!n.name || n.name.indexOf('Forme')===0) return;
    var p=new THREE.Vector3(); n.getWorldPosition(p);
    pts.push({nom:n.name,p:p,obj:n});
    log(n.name.padEnd(46)+'  '+p.x.toFixed(4).padStart(7)+' '+p.y.toFixed(4).padStart(7)+' '+p.z.toFixed(4).padStart(7));
  });

  // Axe de symetrie : on cherche la direction ou les pieces vont par paires.
  log('');
  log('--- ecart entre pieces homonymes (donne la direction laterale) ---');
  var vus={};
  pts.forEach(function(a){
    var base=a.nom.replace(/[-<].*$/,'').trim();
    if(!vus[base]) vus[base]=[];
    vus[base].push(a);
  });
  Object.keys(vus).forEach(function(k){
    if(vus[k].length!==2) return;
    var d=vus[k][1].p.clone().sub(vus[k][0].p);
    log(k.padEnd(30)+' delta = ('+d.x.toFixed(3)+', '+d.y.toFixed(3)+', '+d.z.toFixed(3)+')');
  });

  // --- Graphe des liaisons ---------------------------------------------
  // Un axe relie les sous-ensembles dont la matiere passe a son endroit.
  // On teste la proximite aux SOMMETS reels, pas aux boites englobantes,
  // qui se chevauchent trop pour conclure quoi que ce soit.
  var sousEns = racine.children[0] ? racine.children[0].children.slice() : [];
  if (!sousEns.length) sousEns = racine.children.slice();

  var geoms = sousEns.map(function(se){
    var v=[]; var tmp=new THREE.Vector3();
    se.traverse(function(n){
      if(!n.isMesh || !n.geometry || !n.geometry.attributes.position) return;
      var pos=n.geometry.attributes.position;
      var pas=Math.max(1, Math.floor(pos.count/900));   // echantillonnage
      for(var i=0;i<pos.count;i+=pas){
        tmp.fromBufferAttribute(pos,i); n.localToWorld(tmp); v.push(tmp.clone());
      }
    });
    return {nom:se.name.replace(/[_ ]?<.*$/,''), pts:v};
  });

  log('');
  log('--- LIAISONS : pour chaque axe, les pieces qu il traverse ---');
  var SEUIL=0.045;   // 4,5 cm autour de l axe
  pts.forEach(function(a){
    if(!/^axe/i.test(a.nom)) return;
    var touche=[];
    geoms.forEach(function(g){
      var min=1e9;
      for(var i=0;i<g.pts.length;i++){ var d=g.pts[i].distanceTo(a.p); if(d<min) min=d; }
      if(min<SEUIL) touche.push(g.nom+'('+(min*100).toFixed(1)+')');
    });
    log(a.nom.replace(/[_ ]?<.*$/,'').padEnd(26)+' -> '+touche.join('  '));
  });

  // Contacts entre sous-ensembles, y compris ceux sans axe nomme.
  log('');
  log('--- CONTACTS entre sous-ensembles (zone de contact la plus proche) ---');
  for(var a1=0;a1<geoms.length;a1++){
    for(var b1=a1+1;b1<geoms.length;b1++){
      var A=geoms[a1].pts, B=geoms[b1].pts, min=1e9, mA=null, mB=null;
      for(var i=0;i<A.length;i++){
        for(var j=0;j<B.length;j++){
          var d=A[i].distanceToSquared(B[j]);
          if(d<min){min=d;mA=A[i];mB=B[j];}
        }
      }
      min=Math.sqrt(min);
      if(min<0.030){
        var mid=mA.clone().add(mB).multiplyScalar(0.5);
        log((geoms[a1].nom+' / '+geoms[b1].nom).padEnd(42)+
            ' d='+(min*100).toFixed(1)+' cm  en ('+
            mid.x.toFixed(3)+', '+mid.y.toFixed(3)+', '+mid.z.toFixed(3)+')');
      }
    }
  }
  log('');
  log('(vue de cote ci-dessous : X vers la droite, Y vers le haut)');

  // --- Vue de cote, pour voir la cinematique ---------------------------
  var rd=new THREE.WebGLRenderer({antialias:true});
  rd.setSize(1100,560); rd.setClearColor(0x101418);
  document.body.appendChild(rd.domElement);
  var sc=new THREE.Scene();
  sc.add(new THREE.AmbientLight(0xffffff,1.7));
  var dl2=new THREE.DirectionalLight(0xffffff,1); dl2.position.set(0.5,1,2); sc.add(dl2);
  sc.add(racine);
  pts.forEach(function(a){
    if(!/^axe/i.test(a.nom)) return;
    var m=new THREE.Mesh(new THREE.SphereGeometry(0.022,10,10),
          new THREE.MeshBasicMaterial({color:0x35c9ff,depthTest:false}));
    m.position.copy(a.p); m.renderOrder=900; sc.add(m);
  });
  var bb=new THREE.Box3().setFromObject(racine), ct=new THREE.Vector3(), sz=new THREE.Vector3();
  bb.getCenter(ct); bb.getSize(sz);
  var cam=new THREE.OrthographicCamera(-sz.x*0.55,sz.x*0.55,sz.y*0.75,-sz.y*0.75,0.01,20);
  cam.position.set(ct.x,ct.y,ct.z+3); cam.lookAt(ct);
  rd.render(sc,cam);
}, undefined, function(e){log('ERREUR GLB : '+e);});
</script>
</body>
</html>
