<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Editeur de liaisons - Cric</title>
  <style>
    body { margin: 0; background: #000; }
    #overlay {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      background: rgba(0,0,0,0.92); color: white; font-family: sans-serif;
      z-index: 10; padding: 20px; box-sizing: border-box; overflow-y: auto;
    }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p  { font-size: 13px; color: #aaa; margin: 0 0 14px; max-width: 460px; }
    textarea {
      width: 460px; max-width: 90vw; height: 260px; font-size: 14px;
      font-family: monospace; padding: 12px; border-radius: 10px;
      border: 2px solid #444; background: #1a1a1a; color: #eee;
      margin-bottom: 12px; box-sizing: border-box;
    }
    .btn { padding: 14px 30px; font-size: 17px; border: none; border-radius: 12px;
           color: white; cursor: pointer; margin: 5px; background: #e0245e; }
    .btn-sec { background: #3a5f8a; }
    .btn:disabled { background: #555; }
    #status  { margin-top: 10px; font-size: 13px; color: #aaa; }
    #errbox  { font-size: 11px; color: #ff6b6b; white-space: pre-wrap; max-width: 90vw; margin-top: 6px; }
    canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="overlay">
    <h1>Editeur de liaisons — Cric</h1>
    <p>
      Vérifie ou modifie la liste des points à placer (un par ligne), puis
      entre en réalité mixte. Dans le casque : vise le centre de chaque
      liaison sur le modèle et appuie sur la gâchette pour le poser.
    </p>
    <textarea id="listePoints">A : bati / bras superieur
B : bati / bras inferieur
C : chape / bras superieur
D : chape / bras inferieur
E : verin / bati
F : verin / levier
G : levier / bras superieur
H : charge / chape</textarea>
    <div>
      <button class="btn" id="btnCommencer">Entrer en réalité mixte</button>
    </div>
    <div id="status">Chargement...</div>
    <div id="errbox"></div>
  </div>
  <canvas id="c"></canvas>

  <script>
    window.addEventListener('error', function (e) {
      var el = document.getElementById('errbox');
      if (el) el.textContent = 'ERR: ' + e.message + ' (' + e.filename + ':' + e.lineno + ')';
    });
    window.addEventListener('unhandledrejection', function (e) {
      var el = document.getElementById('errbox');
      if (el) el.textContent = 'ERR: ' + e.reason;
    });
  </script>

  <script src="three.min.js"></script>
  <script src="GLTFLoader.js"></script>
  <script src="editeur.js?v=1.0.0"></script>
</body>
</html>
