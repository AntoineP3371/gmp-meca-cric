<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Exercice de mécanique — Statique graphique en VR</title>
  <style>
    body { margin: 0; background: #000; }
    #overlay {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end; text-align: center;
      color: white; font-family: sans-serif; z-index: 10;
      box-sizing: border-box; pointer-events: none;
    }
    #carte {
      width: 100%; box-sizing: border-box; padding: 22px 20px;
      background: rgba(12,14,20,0.92); border-top: 1px solid #223;
      pointer-events: auto; overflow-y: auto; max-height: 80vh;
    }
    .logos-bar {
      display: flex; align-items: center; justify-content: center;
      background: #fff; border-radius: 14px; padding: 10px 20px;
      margin: 0 auto 14px; width: fit-content;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }
    .logos-bar img { height: 48px; width: auto; display: block; }
    h1 { font-size: 21px; margin: 0 0 10px; }
    p  { font-size: 13px; color: #aaa; margin: 0 auto 16px; max-width: 460px; }
    .btn { padding: 14px 30px; font-size: 17px; border: none; border-radius: 12px;
           color: white; cursor: pointer; margin: 5px; background: #e0245e; }
    .btn:disabled { background: #555; }
    #status  { margin-top: 10px; font-size: 13px; color: #aaa; }
    #errbox  { font-size: 11px; color: #ff6b6b; white-space: pre-wrap; max-width: 90vw; margin: 6px auto 0; }
    canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="overlay">
    <div id="carte">
      <div class="logos-bar">
        <img src="logo-gmp.png" alt="IUT GMP Bordeaux" onerror="this.style.display='none'"/>
      </div>
      <h1>Exercice de mécanique — Statique graphique en VR</h1>
      <p>
        Le cric rouleur affiché ci-dessus doit maintenir une charge de 500 kg
        en équilibre. Dans le casque, tu vas identifier ses pièces, placer
        ses liaisons puis résoudre le problème de statique directement sur le
        système, en réalité mixte.
      </p>
      <div>
        <button class="btn" id="btnCommencer">Entrer en réalité mixte</button>
      </div>
      <div id="status">Chargement...</div>
      <div id="errbox"></div>
    </div>
  </div>
  <canvas id="c"></canvas>

  <script>
    window.addEventListener('error', function (e) {
      var el = document.getElementById('errbox');
      if (el) el.textContent = 'ERR: ' + e.message + ' (' + e.filename + ':' + e.lineno + ')';
    });
    window.addEventListener('unhandledrejection', function (e) {
      var el = document.getElementById('errbox');
      if (el) el.textContent = 'ERR: ' + e.reason;
    });
  </script>

  <script src="three.min.js"></script>
  <script src="GLTFLoader.js"></script>
  <script src="editeur.js?v=2.1.0"></script>
</body>
</html>
